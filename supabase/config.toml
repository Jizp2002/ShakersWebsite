project_id = "shakers-community"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/entrar", "http://localhost:4173/entrar"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Tu código para entrar a Shakers"
content_path = "./templates/code.html"

[auth.email.template.confirmation]
subject = "Bienvenido a Shakers · Tu código de acceso"
content_path = "./templates/code.html"
