[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.18.0"
  VITE_ENABLE_DEMO = "false"
  VITE_AUTH_EMAIL_MODE = "link"
  VITE_GOOGLE_AUTH_ENABLED = "false"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
